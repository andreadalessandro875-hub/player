# Compila l'app iOS su un Mac di GitHub e produce un file .ipa NON firmato.
# Il file va poi installato e firmato dal PC con Sideloadly (o AltStore) usando il proprio Apple ID.
name: Build iOS (IPA non firmata)

on:
  workflow_dispatch:        # avvio manuale dalla scheda Actions
  push:
    tags: ['ios-v*']        # oppure pubblicando un tag, es. ios-v1.0.1

permissions:
  contents: write           # serve per allegare l'IPA alla release quando si usa un tag

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native   # l'app nativa vive nella cartella native/ del repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installa le dipendenze
        run: npm ci

      - name: Genera il progetto iOS
        run: npx expo prebuild --platform ios --clean

      - name: Compila (senza firma)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Loop.xcworkspace \
            -scheme Loop \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 300

      - name: Crea il file IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Loop.app Payload/
          zip -qry Loop.ipa Payload
          ls -lh Loop.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Loop-ipa
          path: native/Loop.ipa
          retention-days: 30

      - name: Allega l'IPA alla release (solo con i tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: native/Loop.ipa
